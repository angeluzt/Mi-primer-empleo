name: APK de prueba

# Compila un APK instalable para probar en un teléfono real y dibuja las pantallas.
# Se ejecuta en cada push y también a mano desde la pestaña Actions.
on:
  push:
    # capturas-ci la escribe este mismo workflow: no debe dispararlo otra vez.
    branches: ["**", "!capturas-ci"]
  workflow_dispatch:

jobs:
  revisar-contenido:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Revisar el contenido
        run: node tools/revisar_contenido.js
      - name: Probar el normalizador del script de IA
        run: node tools/probar_cv.js --simular-roto > /dev/null

  construir-apk:
    runs-on: ubuntu-latest
    needs: revisar-contenido
    permissions:
      # Solo para publicar las capturas en la rama capturas-ci.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # El runner de ubuntu ya trae el SDK de Android. No se usa setup-android
      # porque intenta instalar el paquete obsoleto "tools", que Google ya quitó.
      - name: Preparar el SDK de Android
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "SDK en $SDK"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
          } >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      # La IA no respeta siempre el esquema y eso ya tiró una generación pagada.
      # Estas pruebas corren antes del APK porque son segundos y fallan claro.
      - name: Pruebas
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest -PsinCapturas --no-daemon 2>&1 | tee test.log

      - name: Mostrar pruebas que fallaron
        if: failure()
        run: |
          echo "=== Pruebas ==="
          grep -E "^e: |FAILED|expected:|Exception|What went wrong" -A 6 test.log || echo "(nada en test.log)"

      # Sin --stacktrace: el volcado de Gradle entierra las líneas "e:" del compilador,
      # que son lo único que sirve para arreglar el fallo.
      - name: Construir APK de depuración
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Mostrar errores de compilación
        if: failure()
        run: |
          echo "=== Errores de Kotlin ==="
          grep -E "^e: |^w: .*error|FAILURE|What went wrong" -A 3 build.log || echo "(nada que reportar en build.log)"

      - name: Publicar el APK
        uses: actions/upload-artifact@v4
        with:
          name: mi-primer-empleo-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # Las capturas van después del APK y no lo bloquean: si el dibujo en la JVM
      # falla, la app para probar en el teléfono sale de todos modos.
      - name: Dibujar las pantallas
        id: capturas
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --tests "*.capturas.*" --no-daemon 2>&1 | tee capturas.log

      - name: Mostrar por qué fallaron las capturas
        if: steps.capturas.outcome == 'failure'
        run: |
          grep -E "FAILED|Exception|Caused by|What went wrong" -A 8 capturas.log | head -120 || true

      - name: Publicar las capturas en la rama capturas-ci
        if: hashFiles('app/build/capturas/*.png') != ''
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cp app/build/capturas/*.png "$tmp/"
          cd "$tmp"
          {
            echo "# Capturas de la app"
            echo
            echo "Dibujadas por CI con Robolectric desde \`${GITHUB_REF_NAME}\` @ ${GITHUB_SHA::7}."
            echo "CI reescribe esta rama en cada push: no hagas commits aquí."
          } > README.md
          git init -q -b capturas-ci
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Capturas de ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" capturas-ci
          ls -1 *.png
