name: APK de prueba

# Compila un APK instalable para probar en un teléfono real.
# Se ejecuta en cada push y también a mano desde la pestaña Actions.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  revisar-contenido:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Revisar el contenido
        run: node tools/revisar_contenido.js

  construir-apk:
    runs-on: ubuntu-latest
    needs: revisar-contenido
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # El runner de ubuntu ya trae el SDK de Android. No se usa setup-android
      # porque intenta instalar el paquete obsoleto "tools", que Google ya quitó.
      - name: Preparar el SDK de Android
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "SDK en $SDK"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
          } >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      # La IA no respeta siempre el esquema JSON y eso ya tiró una generación pagada.
      # Estas pruebas cubren cada forma torcida que hemos visto; corren antes del APK
      # porque son segundos y fallan con un mensaje claro.
      - name: Pruebas del normalizador de CV
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon 2>&1 | tee test.log

      - name: Mostrar pruebas que fallaron
        if: failure()
        run: |
          echo "=== Pruebas ==="
          grep -E "^e: |FAILED|expected:|What went wrong" -A 3 test.log || echo "(nada en test.log)"
          find app/build/reports/tests -name "*.html" -newer test.log 2>/dev/null | head -5 || true

      # Sin --stacktrace: el volcado de Gradle entierra las líneas "e:" del compilador,
      # que son lo único que sirve para arreglar el fallo.
      - name: Construir APK de depuración
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Mostrar errores de compilación
        if: failure()
        run: |
          echo "=== Errores de Kotlin ==="
          grep -E "^e: |^w: .*error|FAILURE|What went wrong" -A 3 build.log || echo "(nada que reportar en build.log)"

      - name: Publicar el APK
        uses: actions/upload-artifact@v4
        with:
          name: mi-primer-empleo-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
